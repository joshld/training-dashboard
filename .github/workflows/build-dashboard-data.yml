name: Build dashboard data

on:
  pull_request:
    paths:
      - 'activities/**/*.md'
      - 'plans/**/*.md'
      - 'scripts/build-dashboard-data.mjs'
      - '.github/workflows/build-dashboard-data.yml'
  push:
    branches: [main]
    paths:
      - 'activities/**/*.md'
      - 'plans/**/*.md'
      - 'scripts/build-dashboard-data.mjs'
      - '.github/workflows/build-dashboard-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate sanitised dashboard data
        run: node scripts/build-dashboard-data.mjs

      - name: Validate generated JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/generated-data.json','utf8')); console.log('generated-data.json is valid')"

      - name: Commit generated data
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- docs/generated-data.json; then
            echo 'Generated dashboard data is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated-data.json
          git commit -m 'Generate dashboard data from Markdown'
          git push
